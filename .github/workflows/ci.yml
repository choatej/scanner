name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Linting Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system ".[dev]"

      - name: Run black
        id: black
        run: black --check src tests
        continue-on-error: true

      - name: Run isort
        id: isort
        run: isort --check-only src tests
        continue-on-error: true

      - name: Run flake8
        id: flake8
        run: flake8 src tests
        continue-on-error: true

      - name: Run mypy
        id: mypy
        run: mypy src tests
        continue-on-error: true

      - name: Run bandit
        id: bandit
        run: bandit -r src
        continue-on-error: true

      # uncomment when import-linter is configured
      # - name: Run import-linter
      #   id: import_linter
      #   run: lint-imports
      #   continue-on-error: true

      - name: Summarize lint results
        if: always()
        run: |
          failures=()
          [[ "${{ steps.black.outcome }}" == "failure" ]] && failures+=("black")
          [[ "${{ steps.isort.outcome }}" == "failure" ]] && failures+=("isort")
          [[ "${{ steps.flake8.outcome }}" == "failure" ]] && failures+=("flake8")
          [[ "${{ steps.mypy.outcome }}" == "failure" ]] && failures+=("mypy")
          [[ "${{ steps.bandit.outcome }}" == "failure" ]] && failures+=("bandit")
          [[ "${{ steps.import_linter.outcome }}" == "failure" ]] && failures+=("import-linter")

          if [ ${#failures[@]} -ne 0 ]; then
            echo "Lint failures: ${failures[*]}"
            exit 1
          fi

  tests:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system ".[dev]"

      - name: Run tests
        run: pytest

