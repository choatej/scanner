[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner"
version = "0.1.0"
description = "Scanner - tooling for scanning and cataloging videos from multiple sources."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Scanner Contributors" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
keywords = ["scanner", "metadata", "videos"]
dependencies = [
    "mypy>=1.18.2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.9",
  "black>=24.4.2",
  "flake8>=7.0.0",
  "import-linter>=1.13.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "types-requests>=2.32.0.20241016",
]

[tool.uv]
package = true
dev-dependencies = [
  "bandit>=1.7.9",
  "black>=24.4.2",
  "flake8>=7.0.0",
  "import-linter>=1.13.0",
  "isort>=7.0.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "types-requests>=2.32.0.20241016",
]

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["scanner"]
combine_as_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --disable-warnings --cov=scanner --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
disallow_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
plugins = []

[tool.flake8]
max-line-length = 120
extend-ignore = [
  "E203",
  "W503",
]
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv",
]

[tool.bandit]
skips = ["B101"]
exclude_dirs = ["tests"]

[tool.coverage.run]
branch = true
source = ["scanner"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true


